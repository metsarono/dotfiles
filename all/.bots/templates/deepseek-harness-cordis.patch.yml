- id: connection
  config:
    trustedHosts: ['@DSH_WEB_TRUSTED_HOST@']

- id: agent-default-model
  config:
    provider: helmcortex-opencode-go
    model: deepseek-v4.1-flash

- id: llm-deepseek
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: tool-web
  disabled: true

- insert:
    - id: mcp-recall
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: recall
        transport: streamable-http
        url: @DSH_RECALL_MCP_URL@
        failOnStartupError: false

    - id: mcp-timeark
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: timeark
        transport: stdio
        command: /home/metsatron/HelmCortex/FORGE/bin/helmcortex-anaconda
        args:
          - /home/metsatron/HelmCortex/CORE/TimeArk/server.py
        cwd: /home/metsatron/HelmCortex
        failOnStartupError: false

    - id: mcp-fleet-health
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: fleet-health
        transport: stdio
        command: /home/metsatron/HelmCortex/FORGE/bin/helmcortex-anaconda
        args:
          - /home/metsatron/HelmCortex/FORGE/bin/fleet-health-mcp
        cwd: /home/metsatron/HelmCortex
        failOnStartupError: false

    - id: mcp-memory-out
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: memory-out
        transport: stdio
        command: /home/metsatron/HelmCortex/FORGE/bin/helmcortex-anaconda
        args:
          - /home/metsatron/HelmCortex/FORGE/bin/deepseek-memory-out-mcp
        cwd: /home/metsatron/HelmCortex
        failOnStartupError: false

    - id: mcp-agentify
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: agentify
        transport: stdio
        command: /home/metsatron/DotCortex/all/.local/bin/agentify-desktop-mcp
        cwd: /home/metsatron/HelmCortex
        failOnStartupError: false
