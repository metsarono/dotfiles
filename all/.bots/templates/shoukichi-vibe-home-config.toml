# Shoukichi's VIBE_HOME config.toml (installed at ~/.config/vibe-telegram/vibe-home/config.toml
# by the operator; never inside the operator's own ~/.vibe).
# Explicit approval only — vibe's schema default is accept-edits and its
# picker offers auto-approve; both are refused here. Fixture-tested.
default_agent = "ask"
# Mistral's subscription model listing exposes zai-glm-5-3 (GLM-5.3, text
# only) and mistral-vibe-cli-latest (Medium 3.5, vision). Shoukichi's body
# is GLM-5.3; the exact model id on the API is zai-glm-5-3.
active_model = "zai-glm-5-3"
allowed_models = ["zai-glm-5-3"]

[[providers]]
name = "mistral"
# vibe-acp rejects a provider without api_base (JSON-RPC -31002,
# "providers.0.api_base: Field required"), so the full block is spelled out.
api_base = "https://api.mistral.ai/v1"
api_key_env_var = "MISTRAL_API_KEY"
backend = "mistral"
# api_key_env_var stays MISTRAL_API_KEY (the provider default); the
# wrapper imports MISTRAL_VIBE_API_KEY from the private env file into that
# name, so the subscription key rides the default provider cleanly.

[models.zai-glm-5-3]
name = "zai-glm-5-3"
provider = "mistral"
alias = "zai-glm-5-3"
display_name = "GLM-5.3"
supports_images = false
